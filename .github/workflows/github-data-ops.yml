



name: GitHub Data Ops

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时运行一次
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-data-ops.yml

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code & Router
        run: npm install -g @anthropic-ai/claude-code @musistudio/claude-code-router

      - name: Configure Claude Code Router
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json << EOF
          {
            "APIKEY": "${GEMINI_API_KEY}",
            "NON_INTERACTIVE_MODE": true,
            "Providers": [
              {
                "name": "custom",
                "api_base_url": "https://maas-api.ai-yuanjing.com/openapi/compatible-mode/v1/chat/completions",
                "api_key": "${GEMINI_API_KEY}",
                "models": ["glm-5"]
              },
              {
                "name": "custom2",
                "api_base_url": "http://35.212.185.123:8317/v1/chat/completions",
                "api_key": "${GEMINI2_API_KEY}",
                "models": ["gpt-5.3-codex"]
              }
            ],
            "Router": {
              "default": "custom2,gpt-5.3-codex",
              "background": "custom,glm-5",
              "think": "custom2,gpt-5.3-codex",
              "longContext": "custom,glm-5",
              "webSearch": "custom2,gpt-5.3-codex"

            }
          }
          EOF
      - name: Debug - Print config
        run: |
          echo "=== config.json ==="
          cat ~/.claude-code-router/config.json
          echo "=== GEMINI_API_KEY set? ==="
          [ -n "$GEMINI_API_KEY" ] && echo "YES" || echo "NO (empty!)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Install skills
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/. ~/.claude/skills/

      - name: Install Google Indexing dependencies
        run: npm install googleapis

      - name: Restore ETag cache
        uses: actions/cache@v4
        with:
          path: /tmp/etag-cache.json
          key: etag-cache-${{ github.run_id }}
          restore-keys: etag-cache-

      - name: Check for updates (ETag probe)
        run: node scripts/check-updates.js
        env:
          SITE_URL: https://zitons-logup-re.hf.space

      - name: Capture sitemap before ops
        run: |
          curl -sf https://zitons-logup-re.hf.space/sitemap.xml -o /tmp/sitemap_before.xml \
            || echo '<urlset/>' > /tmp/sitemap_before.xml
          echo "运营前 URL 数量: $(grep -c '<loc>' /tmp/sitemap_before.xml || echo 0)"

      - name: Run github-data-ops skill
        run: |
          echo 'export ANTHROPIC_BASE_URL="http://127.0.0.1:3456"' >> ~/.zshrc
          source ~/.zshrc
          CHANGED=$(cat /tmp/changed-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          if [ -n "$CHANGED" ]; then
            EXTRA="以下项目页面已变化（ETag/Last-Modified 探针检测），请优先检查其版本更新：${CHANGED}。"
          else
            EXTRA=""
          fi
          ccr code -p "/github-data-ops 自主运营项目数据库：先查询现有项目避免重复，按30%追热点（GitHub Trending/Product Hunt/应用商店榜单/科技媒体热点等）+70%填补空白（小众精品、商业工具、中文资料少的软件）策略，收录范围不限（GitHub开源项目、Android/iOS App、Windows/macOS桌面软件、SaaS服务等均可），自行爬取版本和更新日志并翻译为中文，通过 API https://zitons-logup-re.hf.space 直接执行，无需确认，本次至少新增5个项目。${EXTRA}" \
            --dangerously-skip-permissions \
            --verbose \
            --model gpt-5.3-codex
            --output-format stream-json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DDGS_SEARCH_API: ${{ secrets.DDGS_SEARCH_API }}
          ANTHROPIC_BASE_URL: http://localhost:3456
        
      - name: Submit new URLs to Google Indexing API
        if: always()
        run: node scripts/submit-to-indexing.js
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SITE_URL: https://zitons-logup-re.hf.space
          SITEMAP_BEFORE_FILE: /tmp/sitemap_before.xml
