name: GitHub Data Ops

on:
  schedule:
    - cron: "0 */3 * * *" # 每 3 小时：version-extractor 全库 TTL 扫更新
  workflow_dispatch: # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 全库 TTL 扫：只查距上次检查超过 CHECK_TTL_HOURS 的项目（version-extractor 提取）
      - name: "Update existing projects via version-extractor (sweep, TTL)"
        run: node scripts/update-existing-projects.js
        env:
          SITE_URL: https://zitons-logup-re.hf.space
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          EXTRACTOR_URL: ${{ secrets.EXTRACTOR_URL }}
          CHECK_TTL_HOURS: 24
          NEEDS_AI_FILE: /tmp/needs-ai-projects.txt
