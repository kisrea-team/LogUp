name: Hourly GitHub Data Ops

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点运行
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-data-ops.yml

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code & Router
        run: npm install -g @anthropic-ai/claude-code @musistudio/claude-code-router

      - name: Configure Claude Code Router (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json << EOF
          {
            "APIKEY": "${GEMINI_API_KEY}",
            "PORT": 3001,
            "Providers": [
              {
                "name": "gemini",
                "api_base_url": "https://generativelanguage.googleapis.com/v1beta/models/",
                "api_key": "${GEMINI_API_KEY}",
                "models": ["gemini-2.5-flash"],
                "transformer": {
                  "use": ["gemini"]
                }
              }
            ],
            "Router": {
              "default": "gemini,gemini-2.5-flash",
              "background": "gemini,gemini-2.5-flash",
              "think": "gemini,gemini-2.5-flash"
            }
          }
          EOF

      - name: Debug - Print config
        run: |
          echo "=== config.json ==="
          cat ~/.claude-code-router/config.json
          echo "=== GEMINI_API_KEY set? ==="
          [ -n "$GEMINI_API_KEY" ] && echo "YES" || echo "NO (empty!)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Start Claude Code Router
        run: nohup ccr start > /tmp/ccr.log 2>&1 &

      - name: Wait for router to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -s http://localhost:3001 > /dev/null 2>&1; then
              echo "Router ready after ${i} attempts"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 3
          done
          echo "Router failed to start. Logs:"
          cat /tmp/ccr.log
          exit 1

      - name: Install skills
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/. ~/.claude/skills/

      - name: Run github-data-ops skill
        run: |
          claude -p "/github-data-ops 立即调用 POST https://zitons-logup-re.hf.space/api/scrape/github/trending 触发热门项目抓取，等待响应后报告结果" \
            --dangerously-skip-permissions \
            --model claude-3-5-sonnet-20241022 \
            --max-turns 20
        env:
          ANTHROPIC_BASE_URL: http://localhost:3001
          ANTHROPIC_API_KEY: dummy
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
