name: Hourly GitHub Data Ops

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点运行
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-data-ops.yml

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code & Router
        run: npm install -g @anthropic-ai/claude-code @musistudio/claude-code-router

      - name: Configure Claude Code Router (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json << EOF
          {
            "PORT": 3001,
            "Providers": [
              {
                "name": "gemini",
                "type": "google-gemini",
                "apiKey": "${GEMINI_API_KEY}",
                "models": [
                  {
                    "name": "gemini-2.5-flash",
                    "contextWindow": 1000000
                  }
                ]
              }
            ],
            "Router": {
              "default": "gemini,gemini-2.5-flash",
              "claude-sonnet-4-6": "gemini,gemini-2.5-flash",
              "claude-3-5-sonnet-20241022": "gemini,gemini-2.5-flash",
              "claude-3-7-sonnet-20250219": "gemini,gemini-2.5-flash"
            }
          }
          EOF

      - name: Install skills
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/. ~/.claude/skills/

      - name: Run github-data-ops skill
        run: |
          ccr code -p "/github-data-ops 抓取 GitHub 热门项目数据写入数据库" \
            --dangerously-skip-permissions \
            --model claude-3-5-sonnet-20241022
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
