
name: Hourly GitHub Data Ops

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点运行
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-data-ops.yml

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code & Router
        run: npm install -g @anthropic-ai/claude-code @musistudio/claude-code-router

      - name: Configure Claude Code Router
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json << EOF
          {
            "APIKEY": "${GEMINI_API_KEY}",
            "NON_INTERACTIVE_MODE": true,
            "Providers": [
              {
                "name": "custom",
                "api_base_url": "http://35.212.185.123:8317/v1/chat/completions",
                "api_key": "${GEMINI_API_KEY}",
                "models": ["gpt-5.2"]
              }
            ],
            "Router": {
              "default": "custom,gpt-5.2",
              "background": "custom,gpt-5.2",
              "think": "custom,gpt-5.2"
            }
          }
          EOF
      - name: Debug - Print config
        run: |
          echo "=== config.json ==="
          cat ~/.claude-code-router/config.json
          echo "=== GEMINI_API_KEY set? ==="
          [ -n "$GEMINI_API_KEY" ] && echo "YES" || echo "NO (empty!)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Install skills
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/. ~/.claude/skills/
      - name: Run github-data-ops skill
        run: |
          ccr code -p "/github-data-ops 自主运营项目数据库：先查询现有项目避免重复，按30%追热点（GitHub Trending/X爆火）+70%填补空白（小众精品、商业工具、中文资料少的软件）策略，自主选品不限开源闭源，自行爬取更新日志并翻译为中文，通过 API https://zitons-logup-re.hf.space 直接执行，无需确认，本次至少新增5个项目" \
            --dangerously-skip-permissions \
            --model claude-3-5-sonnet-20241022 \
            --max-turns 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}