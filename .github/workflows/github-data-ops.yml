name: GitHub Data Ops

on:
  schedule:
    - cron: "0 */6 * * *" # 每6小时运行一次
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-data-ops.yml

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Claude Code Router
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json <<EOF
          {
            "APIKEY": "${GEMINI_API_KEY}",
            "NON_INTERACTIVE_MODE": true,
            "Providers": [
              {
                "name": "custom",
                "api_base_url": "https://maas-api.ai-yuanjing.com/openapi/compatible-mode/v1/chat/completions",
                "api_key": "${GEMINI_API_KEY}",
                "models": ["glm-5"]
              },
              {
                "name": "custom2",
                "api_base_url": "http://35.212.185.123:8317/v1/chat/completions",
                "api_key": "${GEMINI2_API_KEY}",
                "models": ["gpt-5.3-codex"]
              }
            ],
            "Router": {
              "default": "custom2,gpt-5.3-codex",
              "background": "custom,glm-5",
              "think": "custom2,gpt-5.3-codex",
              "longContext": "custom,glm-5",
              "webSearch": "custom2,gpt-5.3-codex"
            }
          }
          EOF

      - name: Debug - Print config status
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
        run: |
          echo "=== config exists? ==="
          test -f ~/.claude-code-router/config.json && echo "YES" || echo "NO"
          echo "=== GEMINI_API_KEY set? ==="
          [ -n "$GEMINI_API_KEY" ] && echo "YES" || echo "NO (empty!)"
          echo "=== GEMINI2_API_KEY set? ==="
          [ -n "$GEMINI2_API_KEY" ] && echo "YES" || echo "NO (empty!)"

      - name: Install skills
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/. ~/.claude/skills/

      - name: Install Google Indexing dependencies
        run: npm install googleapis

      - name: Restore ETag cache
        uses: actions/cache@v4
        with:
          path: /tmp/etag-cache.json
          key: etag-cache-${{ github.run_id }}
          restore-keys: etag-cache-

      - name: Check for updates (ETag probe)
        env:
          SITE_URL: https://zitons-logup-re.hf.space
        run: node scripts/check-updates.js

      - name: Capture sitemap before ops
        run: |
          curl -sf https://zitons-logup-re.hf.space/sitemap.xml -o /tmp/sitemap_before.xml \
            || echo '<urlset/>' > /tmp/sitemap_before.xml
          echo "运营前 URL 数量: $(grep -c '<loc>' /tmp/sitemap_before.xml || echo 0)"

      - name: Start Claude Code Router Daemon
        run: |
          nohup ~/.bun/bin/bunx @musistudio/claude-code-router@1.0.8 start >/tmp/ccr.log 2>&1 &
          sleep 3

      - name: Prepare Dynamic Prompt
        run: |
          CHANGED=$(cat /tmp/changed-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          if [ -n "$CHANGED" ]; then
            EXTRA="以下项目页面已变化（ETag/Last-Modified 探针检测），请优先检查其版本更新：${CHANGED}。"
          else
            EXTRA=""
          fi

          {
            echo "PROMPT_TEXT<<EOF"
            echo "/github-data-ops 自主运营项目数据库：先查询现有项目避免重复，按30%追热点（GitHub Trending/Product Hunt/应用商店榜单/科技媒体热点等）+70%填补空白（小众精品、商业工具、中文资料少的软件）策略，收录范围不限（GitHub开源项目、Android/iOS App、Windows/macOS桌面软件、SaaS服务等均可），自行爬取版本和更新日志并翻译为中文，通过 API https://zitons-logup-re.hf.space 直接执行，无需确认，本次至少新增5个项目。${EXTRA}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run Claude Code Core (verbose streaming)
        env:
          ANTHROPIC_BASE_URL: http://localhost:3456
          ANTHROPIC_API_KEY: "sk-ant-local-ccr-1234567890"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DDGS_SEARCH_API: ${{ secrets.DDGS_SEARCH_API }}
          FORCE_COLOR: "1"
          CLAUDE_CODE_OUTPUT_STYLE: "verbose"
          CI: "true"
          TERM: "xterm-256color"
        run: |
          set -euo pipefail

          CLAUDE_CMD="~/.bun/bin/bunx @anthropic-ai/claude-code@latest \
            --model claude-3-5-sonnet-20241022 \
            --dangerously-skip-permissions \
            -p \"$PROMPT_TEXT\""

          # 自动选择“1. 信任当前目录”，并实时输出 verbose 日志
          printf '1\n' | script -q -e -f -c "$CLAUDE_CMD" /dev/null 2>&1 | tee /tmp/claude-code.log

      - name: Submit new URLs to Google Indexing API
        if: always()
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SITE_URL: https://zitons-logup-re.hf.space
          SITEMAP_BEFORE_FILE: /tmp/sitemap_before.xml
        run: node scripts/submit-to-indexing.js

      - name: Debug logs on failure
        if: failure()
        run: |
          echo "===== /tmp/ccr.log ====="
          [ -f /tmp/ccr.log ] && tail -n 300 /tmp/ccr.log || echo "ccr.log not found"
          echo "===== /tmp/claude-code.log ====="
          [ -f /tmp/claude-code.log ] && tail -n 300 /tmp/claude-code.log || echo "claude-code.log not found"
