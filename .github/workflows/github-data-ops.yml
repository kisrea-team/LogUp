        run: |
          nohup ~/.bun/bin/bunx @musistudio/claude-code-router@1.0.8 start &
          sleep 3 # 等待3秒，确保本地 3456 端口服务完全启动
        shell: bash

      - name: Prepare Dynamic Prompt (整合 ETag 结果)
        id: prompt_gen
        run: |
          CHANGED=$(cat /tmp/changed-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          if [ -n "$CHANGED" ]; then
