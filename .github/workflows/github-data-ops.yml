name: GitHub Data Ops

on:
  schedule:
    - cron: "0 */3 * * *" # 每6小时运行一次
  workflow_dispatch: # 允许手动触发
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-data-ops.yml

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set npm global prefix
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Cache Claude Code & Router
        id: npm-global-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: npm-global-claude-ccr-${{ hashFiles('.github/workflows/github-data-ops.yml') }}

      - name: Install Claude Code & Router
        if: steps.npm-global-cache.outputs.cache-hit != 'true'
        run: npm install -g @anthropic-ai/claude-code @musistudio/claude-code-router

      - name: Configure Claude Code Router
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEMINI3_API_KEY: ${{ secrets.GEMINI3_API_KEY }}
          GEMINI4_API_KEY: ${{ secrets.GEMINI4_API_KEY }}
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json << EOF
          {
            "APIKEY": "${GEMINI_API_KEY}",
            "NON_INTERACTIVE_MODE": true,
            "Providers": [
              {
                "name": "custom",
                "api_base_url": "https://maas-api.ai-yuanjing.com/openapi/compatible-mode/v1/chat/completions",
                "api_key": "${GEMINI_API_KEY}",
                "models": ["glm-5"],
                "transformer": {
                  "use": [
                     [
                       "maxtoken",
                       {
                         "max_tokens": 25000
                       }
                     ]
                  ]
                }
              },
              {
                "name": "custom2",
                "api_base_url": "http://35.212.185.123:8317/v1/chat/completions",
                "api_key": "${GEMINI2_API_KEY}",
                "models": ["gpt-5.3-codex"]
              },
              {
                "name": "gemini",  
                "api_base_url": "https://generativelanguage.googleapis.com/v1beta/models/",
                "api_key": "${GEMINI3_API_KEY}",
                "models": ["gemini-2.5-flash-lite"],
                "transformer": {
                  "use": ["gemini"]
                }
              },
              {
                "name": "llama",
                "api_base_url": "https://integrate.api.nvidia.com/v1/chat/completions",
                "api_key": "${GEMINI4_API_KEY}",
                "models": ["meta/llama-3.3-70b-instruct"]
              }
            ],
            "Router": {
              "default": "custom2,gpt-5.3-codex",
              "background": "custom,glm-5",
              "think": "custom2,gpt-5.4",
              "longContext": "custom2,gpt-5.4",
              "webSearch": "custom2,gpt-5.4",
              "longContextThreshold": 10000
            }


          }
          EOF
      - name: Debug - Print config
        run: |
          echo "=== config.json ==="
          cat ~/.claude-code-router/config.json
          echo "=== GEMINI_API_KEY set? ==="
          [ -n "$GEMINI_API_KEY" ] && echo "YES" || echo "NO (empty!)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Install skills and agents
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/. ~/.claude/skills/
          echo "Installed skills to ~/.claude/skills/"
          echo "Agent definitions in .claude/agents/ (auto-discovered by Claude Code from project directory)"
          ls -la .claude/agents/ 2>/dev/null || echo "No .claude/agents/ in project directory"

      - name: Install uv for MCP fetch server
        uses: astral-sh/setup-uv@v5

      - name: Configure MCP servers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > .mcp.json << EOF
          {
            "mcpServers": {
              "fetch": {
                "command": "uvx",
                "args": ["mcp-server-fetch"]
              },
              "postgres": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-postgres", "${DATABASE_URL}"]
              }
            }
          }
          EOF

      - name: Install Google Indexing dependencies
        run: npm install googleapis

      - name: Install Playwright
        run: npm install playwright && npx playwright install chromium --with-deps

      - name: Restore ETag cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/etag-cache.json
          key: etag-cache-${{ github.run_id }}
          restore-keys: etag-cache-

      - name: Check for updates (ETag probe)
        run: node scripts/check-updates.js
        env:
          SITE_URL: https://zitons-logup-re.hf.space
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Save ETag cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/etag-cache.json
          key: etag-cache-${{ github.run_id }}
      - name: Capture sitemap before ops
        run: |
          curl -sf https://zitons-logup-re.hf.space/sitemap.xml -o /tmp/sitemap_before.xml \
            || echo '<urlset/>' > /tmp/sitemap_before.xml
          echo "运营前 URL 数量: $(grep -c '<loc>' /tmp/sitemap_before.xml || echo 0)"

      - name: Auto-process GitHub project updates
        run: node scripts/process-github-updates.js
        env:
          SITE_URL: https://zitons-logup-re.hf.space
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: "Phase 1: Update existing projects (sub-agent orchestration)"
        run: |
          CHANGED=$(cat /tmp/changed-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          NOCACHE=$(cat /tmp/nocache-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          REGEX_FAILED=$(cat /tmp/regex-failed-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          ccr code -p "本阶段任务：仅更新已有项目，不新增。使用 Task 工具启动子代理，自己不直接操作数据。

          编排步骤：
          1. 为以下每个项目各启动一个 project-handler 子代理（传入「项目名 触发原因」）：
             - changed 项目（仅剩余非 GitHub 项目，触发原因 changed）：${CHANGED:-无}
             - regex-failed 项目（正则失效，触发原因 regex-failed）：${REGEX_FAILED:-无}
          2. 为以下项目各启动一个 nocache-inspector 子代理：${NOCACHE:-无}
          3. 通过 postgres MCP 查询缺少 update_source_url 的项目：
             SELECT name FROM \"Project\" WHERE update_source_url IS NULL OR update_source_url = '' ORDER BY id
             为每个结果各启动一个 project-handler 子代理（触发原因 no-url）
          4. 收到每个子代理结果后只需简单记录，全部完成后统一输出 JSON 数组汇总报告

          环境：API=https://zitons-logup-re.hf.space  DDGS_SEARCH_API=${{ vars.DDGS_SEARCH_API }}  数据库可通过 postgres MCP 访问  GITHUB_TOKEN 已注入（用于 GitHub API）" \
            --dangerously-skip-permissions \
            --verbose \
            --output-format stream-json 2>&1 | tee /tmp/ops-update.jsonl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DDGS_SEARCH_API: ${{ vars.DDGS_SEARCH_API }}

      - name: "Phase 2: Add new projects (sub-agent orchestration)"
        run: |
          ccr code -p "本阶段任务：仅收录新项目，不修改已有项目。使用 Task 工具启动 project-onboarder 子代理，自己不直接操作数据。

          编排步骤：
          1. 通过 postgres MCP 查询现有项目名称，建立查重索引
          2. 按 30%追热点 + 70%填补空白策略选品（收录范围不限：GitHub 开源、Android/iOS App、桌面软件、SaaS 等）
          3. 为每个候选新项目使用 Task 工具启动 project-onboarder 代理，仅传入候选项目名称和来源 URL，子代理自行完成查重和收录
          4. 汇总所有子代理返回的 JSON 结果，输出运营报告
          5. 本次至少新增 5 个项目，GitHub 与非 GitHub 项目比例约 1:1

          环境：API=https://zitons-logup-re.hf.space  DDGS_SEARCH_API=${{ vars.DDGS_SEARCH_API }}  数据库可通过 postgres MCP 直接访问  GITHUB_TOKEN 已注入环境变量（用于 GitHub API 鉴权以规避限流）" \
            --dangerously-skip-permissions \
            --verbose \
            --output-format stream-json 2>&1 | tee /tmp/ops-add.jsonl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DDGS_SEARCH_API: ${{ vars.DDGS_SEARCH_API }}

      - name: Create operation report issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          function extractResult(file) {
            try {
              const lines = fs.readFileSync(file, 'utf-8').trim().split('\n');
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const obj = JSON.parse(lines[i]);
                  if (obj.type === 'result' && obj.result) return obj.result;
                } catch {}
              }
            } catch {}
            return null;
          }
          function readJson(file) {
            try {
              return JSON.parse(fs.readFileSync(file, 'utf-8'));
            } catch {
              return null;
            }
          }
          const update = extractResult('/tmp/ops-update.jsonl');
          const add = extractResult('/tmp/ops-add.jsonl');
          const githubReport = readJson('/tmp/github-update-report.json');
          const githubFailures = Array.isArray(githubReport?.processed)
            ? githubReport.processed.filter((item) => item && item.action === 'failed')
            : [];
          const date = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
          let body = '## 运营报告\n\n**时间**：' + date + '\n\n';
          body += '### 存量更新\n\n' + (update || '未执行或无输出') + '\n\n';
          if (githubFailures.length > 0) {
            body += '### GitHub 自动更新失败\n\n';
            body += githubFailures.map((item) => `- ${item.name}: ${item.error || '未知错误'}`).join('\n') + '\n\n';
          }
          body += '### 新项目收录\n\n' + (add || '未执行或无输出');
          fs.writeFileSync('/tmp/issue-body.md', body);
          JSEOF
          gh issue create \
            --title "运营报告 $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body-file /tmp/issue-body.md \
            --repo kisrea-team/LogUp

      - name: Submit new URLs to Google Indexing API
        if: always()
        run: node scripts/submit-to-indexing.js
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SITE_URL: https://zitons-logup-re.hf.space
          SITEMAP_BEFORE_FILE: /tmp/sitemap_before.xml
