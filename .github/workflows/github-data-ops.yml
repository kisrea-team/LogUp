name: GitHub Data Ops

on:
  schedule:
    - cron: '0 */1 * * *'   # 每6小时运行一次
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-data-ops.yml

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code & Router
        run: npm install -g @anthropic-ai/claude-code @musistudio/claude-code-router

      - name: Configure Claude Code Router
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI2_API_KEY: ${{ secrets.GEMINI2_API_KEY }}
          GEMINI3_API_KEY: ${{ secrets.GEMINI3_API_KEY }}
          GEMINI4_API_KEY: ${{ secrets.GEMINI4_API_KEY }}
        run: |
          mkdir -p ~/.claude-code-router
          cat > ~/.claude-code-router/config.json << EOF
          {
            "APIKEY": "${GEMINI_API_KEY}",
            "NON_INTERACTIVE_MODE": true,
            "Providers": [
              {
                "name": "custom",
                "api_base_url": "https://maas-api.ai-yuanjing.com/openapi/compatible-mode/v1/chat/completions",
                "api_key": "${GEMINI_API_KEY}",
                "models": ["glm-5"],
                "transformer": {
                  "use": [
                     [
                       "maxtoken",
                       {
                         "max_tokens": 25000
                       }
                     ]
                  ]
                }
              },
              {
                "name": "custom2",
                "api_base_url": "http://35.212.185.123:8317/v1/chat/completions",
                "api_key": "${GEMINI2_API_KEY}",
                "models": ["gpt-5.3-codex"]
              },
              {
                "name": "gemini",  
                "api_base_url": "https://generativelanguage.googleapis.com/v1beta/models/",
                "api_key": "${GEMINI3_API_KEY}",
                "models": ["gemini-2.5-flash-lite"],
                "transformer": {
                  "use": ["gemini"]
                }
              },
              {
                "name": "llama",
                "api_base_url": "https://integrate.api.nvidia.com/v1/chat/completions",
                "api_key": "${GEMINI4_API_KEY}",
                "models": ["meta/llama-3.3-70b-instruct"]
              }
            ],
            "Router": {
              "default": "custom2,gpt-5.3-codex",
              "background": "custom,glm-5",
              "think": "custom2,gpt-5.3-codex",
              "longContext": "custom,glm-5",
              "webSearch": "custom2,gpt-5.3-codex",
              "longContextThreshold": 10000
            }
          }
          EOF
      - name: Debug - Print config
        run: |
          echo "=== config.json ==="
          cat ~/.claude-code-router/config.json
          echo "=== GEMINI_API_KEY set? ==="
          [ -n "$GEMINI_API_KEY" ] && echo "YES" || echo "NO (empty!)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  

      - name: Install skills
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/. ~/.claude/skills/

      - name: Install uv for MCP fetch server
        uses: astral-sh/setup-uv@v5

      - name: Configure MCP servers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > .mcp.json << EOF
          {
            "mcpServers": {
              "fetch": {
                "command": "uvx",
                "args": ["mcp-server-fetch"]
              },
              "postgres": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-postgres", "${DATABASE_URL}"]
              }
            }
          }
          EOF

      - name: Install Google Indexing dependencies
        run: npm install googleapis

      - name: Restore ETag cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/etag-cache.json
          key: etag-cache-${{ github.run_id }}
          restore-keys: etag-cache-

      - name: Check for updates (ETag probe)
        run: node scripts/check-updates.js
        env:
          SITE_URL: https://zitons-logup-re.hf.space
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Save ETag cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/etag-cache.json
          key: etag-cache-${{ github.run_id }}
      - name: Capture sitemap before ops
        run: |
          curl -sf https://zitons-logup-re.hf.space/sitemap.xml -o /tmp/sitemap_before.xml \
            || echo '<urlset/>' > /tmp/sitemap_before.xml
          echo "运营前 URL 数量: $(grep -c '<loc>' /tmp/sitemap_before.xml || echo 0)"

      - name: "Phase 1: Update existing projects"
        run: |
          CHANGED=$(cat /tmp/changed-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          NOCACHE=$(cat /tmp/nocache-projects.txt 2>/dev/null | tr '\n' '、' | sed 's/、$//')
          if [ -n "$CHANGED" ]; then
            CHANGED_MSG="以下项目页面已变化（ETag/Last-Modified 探针检测），请逐一检查版本并更新：${CHANGED}。"
          else
            CHANGED_MSG="本次无 ETag 探针标记变化的项目。"
          fi
          if [ -n "$NOCACHE" ]; then
            NOCACHE_UPDATE_MSG=" 2）以下项目的 update_source_url 服务器不返回缓存头（no-cache），Content-Length 发生了变化，存在更新嫌疑。请用以下方式快速预判哪些最可能已更新：①新闻搜索（/search/news?q={项目名} release）查看近期发布动态；②对比数据库中 latest_update_time 与该项目的典型发布周期，长期未更新者优先；③对高可能性项目直接获取 update_source_url 页面比对版本号。综合信号后仅对高可能性项目做完整版本核查，其余跳过。no-cache 嫌疑项目列表：${NOCACHE}。"
            REGEX_MSG=" 3）对上述 no-cache 项目列表中每个尚未设置 version_regex 字段的项目，必须逐一完成：访问其 update_source_url 页面，分析 HTML/文本结构，编写能精准匹配版本号的正则表达式（必须含捕获组，捕获组1为版本号字符串），然后通过 PUT /api/projects/{id} 将 version_regex 字段写入数据库。每个项目都要处理，不得跳过。"
          else
            NOCACHE_UPDATE_MSG=""
            REGEX_MSG=""
          fi
          ccr code -p "/github-data-ops 本阶段任务：仅更新已有项目，不新增。任务：1）${CHANGED_MSG}${NOCACHE_UPDATE_MSG}${REGEX_MSG} 4）查询所有没有 update_source_url 的项目，全部检查是否有新版本并更新。完成后输出更新汇总。通过 API https://zitons-logup-re.hf.space 直接执行，无需确认。注意: DDGS_SEARCH_API已给出为${{ vars.DDGS_SEARCH_API }}" \
            --dangerously-skip-permissions \
            --verbose \
            --output-format stream-json 2>&1 | tee /tmp/ops-update.jsonl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DDGS_SEARCH_API: ${{ vars.DDGS_SEARCH_API }}

      - name: "Phase 2: Add new projects"
        run: |
          ccr code -p "/github-data-ops 本阶段任务：仅收录新项目，不修改已有项目。先查询现有项目名称避免重复，按30%追热点（GitHub Trending/Product Hunt/应用商店榜单/科技媒体热点等）+70%填补空白（小众精品、商业工具、中文资料少的软件）策略，收录范围不限（GitHub开源项目、Android/iOS App、Windows/macOS桌面软件、SaaS服务等均可），自行爬取版本和更新日志并翻译为中文，通过 API https://zitons-logup-re.hf.space 直接执行，无需确认，本次至少新增5个项目。注意: DDGS_SEARCH_API已给出为${{ vars.DDGS_SEARCH_API }}" \
            --dangerously-skip-permissions \
            --verbose \
            --output-format stream-json 2>&1 | tee /tmp/ops-add.jsonl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DDGS_SEARCH_API: ${{ vars.DDGS_SEARCH_API }}

      - name: Create operation report issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          function extractResult(file) {
            try {
              const lines = fs.readFileSync(file, 'utf-8').trim().split('\n');
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const obj = JSON.parse(lines[i]);
                  if (obj.type === 'result' && obj.result) return obj.result;
                } catch {}
              }
            } catch {}
            return null;
          }
          const update = extractResult('/tmp/ops-update.jsonl');
          const add = extractResult('/tmp/ops-add.jsonl');
          const date = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
          let body = '## 运营报告\n\n**时间**：' + date + '\n\n';
          body += '### 存量更新\n\n' + (update || '未执行或无输出') + '\n\n';
          body += '### 新项目收录\n\n' + (add || '未执行或无输出');
          fs.writeFileSync('/tmp/issue-body.md', body);
          JSEOF
          gh issue create \
            --title "运营报告 $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body-file /tmp/issue-body.md \
            --repo kisrea-team/LogUp

      - name: Submit new URLs to Google Indexing API
        if: always()
        run: node scripts/submit-to-indexing.js
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SITE_URL: https://zitons-logup-re.hf.space
          SITEMAP_BEFORE_FILE: /tmp/sitemap_before.xml
